[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formula-development-orchestrator"
version = "0.1.0"
description = "Isolated O0 bootstrap for Formula development orchestration"
requires-python = ">=3.10"
dependencies = ["openai-agents>=0.14.0,<1.0.0"]

[project.scripts]
formula-orchestrator = "formula_orchestrator.cli:main"

[dependency-groups]
dev = ["pytest>=8.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/formula_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
